<!DOCTYPE html>
<html lang="en">

<head>
  <title>T22-the DOM</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- stylesheets *******************************************-->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/dtec_favicon.png">
</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <h1>T22-the DOM</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>

  <p><br><br><i>Copy your HTML from the last task and keep building.</i><br><br><br><br></p>

  <div id="spaceForJavaScriptOutput">

      <form onsubmit="return false;">
    <label for="itemField">Enter a shopping list item:</label>
    <input type="text" id="itemField" placeholder="e.g. Milk" required>
    <input type="submit" value="Add Item" onClick="addItem()">
  </form>
 
  <form onsubmit="return false;">
    <input type="submit" value="Display Shopping List" onClick="displayList()">
  </form>
 
  <form onsubmit="return false;">
    <label for="nameField">Enter your name:</label>
    <input type="text" id="nameField" placeholder="e.g. David" required>
    <input type="submit" value="Check Name" onClick="checkName()">
  </form>
 
  <form onsubmit="return false;">
    <label for="userNameField">Name:</label>
    <input type="text" id="userNameField" placeholder="e.g. David" required>
 
    <label for="userAgeField">Age:</label>
    <input type="number" id="userAgeField" placeholder="e.g. 15" required>
 
    <label for="userPocketMoneyField">Pocket money:</label>
    <input type="number" id="userPocketMoneyField" placeholder="e.g. 20" required>
 
    <label for="chocolateField">Favourite chocolate:</label>
    <select id="chocolateField">
      <option value="Milk">Milk</option>
      <option value="Dark">Dark</option>
      <option value="White">White</option>
    </select>
 
    <input type="submit" value="Add User" onClick="addUser()">
  </form>
 
  <form onsubmit="return false;">
    <input type="submit" value="Display Welcome" onClick="displayWelcome()">
  </form>
 
  <form onsubmit="return false;">
    <input type="submit" value="Clear Fields" onClick="clearFields()">
  </form>

  </div>


  <script src="../t22_the_DOM.js"></script>

</body>

</html>
<!--*************************************************************
  END OF T22_THE_DOM.HTML
**************************************************************-->
