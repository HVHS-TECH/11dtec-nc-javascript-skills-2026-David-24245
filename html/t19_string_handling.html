<!DOCTYPE html>
<html lang="en">

<head>
  <title>T19-string handling</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/dtec_favicon.png">
</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <h1>T19-string handling</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>

  <div id="spaceForJavaScriptOutput">

      <form onsubmit="return false;">
    <label for="itemField">Enter a shopping list item:</label>
    <input type="text" id="itemField" placeholder="e.g. Milk" required>
    <input type="submit" value="Add Item" onClick="addItem()">
  </form>

  <form onsubmit="return false;">
    <input type="submit" value="Display Shopping List" onClick="displayList()">
  </form>

  <form onsubmit="return false;">
    <label for="nameField">Enter your name:</label>
    <input type="text" id="nameField" placeholder="e.g. David" required>
    <input type="submit" value="Check Name" onClick="checkName()">
  </form>

  </div>


  <script src="../t19_string_handling.js"></script>

</body>

</html>
<!--*************************************************************
  END OF T19_STRING_HANDLING.HTML
**************************************************************-->
